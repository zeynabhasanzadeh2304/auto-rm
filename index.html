<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTO RM - Dealership Catalog</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #f4f5f8; color: #333; }

    header { background-color: #091983; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
    
    .brand-logo { display: flex; flex-direction: column; text-decoration: none; }
    .brand-svg { width: 140px; height: auto; margin-bottom: -5px; }
    .brand-text { font-family: 'Montserrat', sans-serif; font-size: 1.6rem; font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
    .brand-text .auto { color: #ffffff; }
    .brand-text .rm { color: #a5b4fc; margin-left: 3px; }

    .header-contact { font-size: 0.9rem; text-align: right; color: #e0e7ff; }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

    /* Search Input Bar */
    .search-container { margin-bottom: 25px; }
    #searchInput {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #searchInput:focus {
      border-color: #091983;
      box-shadow: 0 0 0 3px rgba(9, 25, 131, 0.15);
    }

    /* Inventory Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-details { padding: 15px; }
    .price { font-size: 1.3rem; font-weight: bold; color: #091983; margin-bottom: 5px; }
    .title { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; }
    .meta { font-size: 0.85rem; color: #666; }

    /* Modal Backdrop & Content */
    .modal-backdrop {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; border-radius: 10px; width: 90%; max-width: 600px;
      overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .close-btn {
      position: absolute; top: 10px; right: 15px; font-size: 1.8rem;
      color: white; background: rgba(0,0,0,0.5); border: none; border-radius: 50%;
      width: 35px; height: 35px; cursor: pointer; z-index: 10; display: flex;
      align-items: center; justify-content: center;
    }
    .carousel-container { position: relative; width: 100%; height: 320px; background: #000; }
    .carousel-container img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.5); color: white; border: none;
      font-size: 1.5rem; padding: 10px 15px; cursor: pointer; border-radius: 4px;
    }
    .prev-btn { left: 10px; }
    .next-btn { right: 10px; }
    .modal-body { padding: 20px; }
    .modal-price { font-size: 1.6rem; font-weight: bold; color: #091983; }
    .modal-title { font-size: 1.3rem; margin-bottom: 15px; }
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-size: 0.95rem; }
    .specs-item { border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .specs-item span { color: #666; }
    .whatsapp-btn {
      display: block; text-align: center; background-color: #25D366; color: white;
      text-decoration: none; padding: 12px; font-weight: bold; border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand-logo">
      <svg class="brand-svg" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 80 Q 90 25 280 40" fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"/>
        <path d="M 60 55 C 80 55, 100 25, 140 25 C 180 25, 210 55, 240 55" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  </header>
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto 20px auto;">
    
    <!-- 1. Your Existing Search Input (Ensure the ID matches the script above) -->
    <input type="text" id="yourSearchBarID" placeholder="Search for models..." 
           style="padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;">

    <!-- 2. The New Functional Dropdown (Styled with your own inline CSS) -->
    <select id="installmentFilter" 
            style="width: 100%; padding: 12px; font-size: 16px; 
                   border: 2px solid #ddd; border-radius: 6px; 
                   background-color: white; color: #333; cursor: pointer;">
        <!-- Important: value names here match the filtering logic -->
        <option value="all">Ödəniş növü fərq etməz (All)</option>
        <option value="kredit_only">Kreditlə (Installments)</option>
        <option value="nagd_only">Nağd (Full Payment)</option>
    </select>
</div>

    <!-- ======================================== -->

    <!-- Cards Grid -->
    <div class="grid" id="inventoryGrid"></div>
  </div>

    <!-- Cards Grid -->
    <div class="grid" id="inventoryGrid"></div>
  </div>
    <!-- Dropdown Menu -->

    <!-- Cards Grid -->
    <div class="grid" id="inventoryGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="carModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      
      <div class="carousel-container">
        <button class="carousel-btn prev-btn" onclick="prevPhoto()">&#10094;</button>
        <img id="carouselImage" src="" alt="Car Photo">
        <button class="carousel-btn next-btn" onclick="nextPhoto()">&#10095;</button>
      </div>

      <div class="modal-body">
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-title" id="modalTitle"></div>

        <div class="specs-grid">
          <div class="specs-item"><span>Year:</span> <strong id="specYear"></strong></div>
          <div class="specs-item"><span>Engine:</span> <strong id="specEngine"></strong></div>
          <div class="specs-item"><span>Mileage:</span> <strong id="specMileage"></strong></div>
          <div class="specs-item"><span></span> <strong id="specCity"></strong></div>
          <div class="specs-item"><span></span> <strong id="specInst"></strong></div>
        </div>

        <a href="https://wa.me/994120000000" class="whatsapp-btn">Contact on WhatsApp</a>
      </div>
    </div>
  </div>
<script>
    // Master variables (Unified)
    let carsData = []; // Full list from JSON
    let currentCar = null;
    let currentPhotoIndex = 0;

    // 1. DOM References (IDs must match your HTML)
    const gridContainer = document.getElementById('inventoryGrid');
    const searchInput = document.getElementById('searchInput');
    const installmentFilter = document.getElementById('installmentFilter');

    // 2. Initial Fetch (Your original dynamic loading logic)
    // It triggers performUnifiedFiltering() initially to show all cars.
    fetch('cars.json')
        .then(response => response.json())
        .then(data => {
            carsData = data; // Store the master list in memory
            performUnifiedFiltering(); // Show all cars by default
        })
        .catch(error => {
            console.error('⛔ Error loading JSON:', error);
            gridContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">JSON məlumatlarını yükləmək mümkün olmadı.</p>';
        });

    // 3. THE NEW UNIFIED FILTERING FUNCTION (Search + Dropdown)
    function performUnifiedFiltering() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const selectedPaymentValue = installmentFilter.value;

        // Filter the MASTER LIST stored in memory
        const filteredCars = carsData.filter(car => {
            
            // --- CONDITION 1: Dropdown/Payment Type ---
            // We assemble all text that would appear on the card to check for "Kredit" or "Nagd".
            const allCardTextToCheckForPayment = `${car.price} ${car.title} ${car.year} ${car.engine} ${car.mileage} ${car.city}`.toLowerCase();
            
            let matchesPaymentFilter = false;
            if (selectedPaymentValue === 'all') {
                matchesPaymentFilter = true; // "Doesn't Matter" is chosen
            } else if (selectedPaymentValue === 'kredit_only' && allCardTextToCheckForPayment.includes('kredit')) {
                matchesPaymentFilter = true;
            } else if (selectedPaymentValue === 'nagd_only' && allCardTextToCheckForPayment.includes('nagd')) {
                matchesPaymentFilter = true;
            }

            // --- CONDITION 2: Search Input ---
            // Only search by title, as per your original search logic.
            const matchesSearchQuery = (searchTerm === '' || car.title.toLowerCase().includes(searchTerm));

            // Combined logic: A car must satisfy BOTH filters to be shown.
            return matchesPaymentFilter && matchesSearchQuery;
        });

        // Use your existing function to render the finalized, dual-filtered list.
        renderCards(filteredCars);
    }

    // 4. Render Cards Function (Your original dynamic logic, simplified)
    function renderCards(cars) {
        if (!gridContainer) return;
        gridContainer.innerHTML = '';

        if (cars.length === 0) {
            gridContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">Heç bir nəqliyyat vasitəsi tapılmadı.</p>';
            return;
        }

        cars.forEach(car => {
            // Note: car structure (id, photos[0], title, etc.) must match your JSON structure.
            const cardHTML = `
                <div class="card" onclick="openModal(${car.id})">
                    <img src="${car.photos[0]}" alt="${car.title}">
                    <div class="card-details">
                        <div class="price">${car.price}</div>
                        <div class="title">${car.title}</div>
                        <div class="meta">${car.year} • ${car.engine} • ${car.mileage} • ${car.city}</div>
                    </div>
                </div>
            `;
            gridContainer.innerHTML += cardHTML;
        });
    }

    // 5. Dual Event Listeners: BOTH inputs trigger the SAME unified function.
    searchInput.addEventListener('input', performUnifiedFiltering);
    installmentFilter.addEventListener('change', performUnifiedFiltering);


    // --- Your Original Modal Logic (UNCHANGED) ---
    function openModal(id) {
        currentCar = carsData.find(c => c.id === id);
        if (!currentCar) return;

        currentPhotoIndex = 0;
        document.getElementById('modalPrice').innerText = currentCar.price;
        document.getElementById('modalTitle').innerText = currentCar.title;
        
        document.getElementById('specYear').innerText = currentCar.year;
        document.getElementById('specEngine').innerText = currentCar.engine;
        document.getElementById('specMileage').innerText = currentCar.mileage;
        document.getElementById('specCity').innerText = currentCar.city;

        updateCarousel();
        document.getElementById('carModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('carModal').style.display = 'none';
    }

    function updateCarousel() {
        document.getElementById('carouselImage').src = currentCar.photos[currentPhotoIndex];
    }

    function nextPhoto() {
        currentPhotoIndex = (currentPhotoIndex + 1) % currentCar.photos.length;
        updateCarousel();
    }

    function prevPhoto() {
        currentPhotoIndex = (currentPhotoIndex - 1 + currentCar.photos.length) % currentCar.photos.length;
        updateCarousel();
    }

    window.onclick = function(event) {
        const modal = document.getElementById('carModal');
        if (event.target === modal) closeModal();
    };
</script>
  

 


            `;
